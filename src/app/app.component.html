<ion-app>


  <!-- ==================================================
       MENÚ LATERAL
       ================================================== -->

  <ion-menu
    side="start"
    menuId="main-menu"
    contentId="main-content"
    type="overlay">


    <ion-header>

      <ion-toolbar>

        <ion-title>
          Leather Chile
        </ion-title>

      </ion-toolbar>

    </ion-header>



    <ion-content>


      <!-- Marca -->
      <div class="menu-brand">

        <h2>
          Leather Chile
        </h2>

        <p>
          Cuero con identidad
        </p>

      </div>



      <ion-list lines="none">


        <!-- INICIO -->
        <ion-item
          button
          (click)="navegar('/home')">

          <ion-label>
            Inicio
          </ion-label>

        </ion-item>



        <!-- HOMBRE -->
        <ion-item
          button
          (click)="navegarCategoria('hombre')">

          <ion-label>
            Hombre
          </ion-label>

        </ion-item>



        <!-- MUJER -->
        <ion-item
          button
          (click)="navegarCategoria('mujer')">

          <ion-label>
            Mujer
          </ion-label>

        </ion-item>



        <!-- OTROS PRODUCTOS -->
        <ion-item
          button
          (click)="navegarCategoria('otros')">

          <ion-label>
            Otros Productos
          </ion-label>

        </ion-item>



        <!-- ==================================================
             ADMINISTRACIÓN
             ================================================== -->

        <ion-accordion-group>


          <ion-accordion
            value="administracion">


            <ion-item
              slot="header">

              <ion-label>
                Administración
              </ion-label>

            </ion-item>



            <div
              class="admin-submenu"
              slot="content">


              <!-- Agregar -->
              <ion-item
                button
                (click)="navegar('/agregar-producto')">

                <ion-label>
                  Agregar productos
                </ion-label>

              </ion-item>



              <!-- Listar -->
              <ion-item
                button
                (click)="navegar('/listar-productos')">

                <ion-label>
                  Listar productos
                </ion-label>

              </ion-item>


            </div>


          </ion-accordion>


        </ion-accordion-group>


      </ion-list>


    </ion-content>


  </ion-menu>



  <!-- Contenido -->
  <ion-router-outlet
    id="main-content">
  </ion-router-outlet>


</ion-app>
